<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Piece Characters</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <button id="themeToggle" class="theme-btn">Light Mode</button>
        </div>
        <img src="assets/one-piece-logo.png" alt="One Piece Logo" class="main-logo">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search characters...">
        </div>
    </header>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Fetching characters...</p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="pagination-container" id="pagination-container" style="display: none;">
        <button id="prevBtn" class="page-btn">← Prev</button>
        <span id="pageInfo" class="page-info">Page 1</span>
        <button id="nextBtn" class="page-btn">Next →</button>
    </div>

    <div id="viewer" class="modal">
        <div class="modal-content">
            <button id="closeBtn" class="close-btn">✕</button>
            <div class="modal-body">
                <div class="image-container">
                    <img id="viewImg" src="" alt="Character Image">
                </div>
                <div class="details-container">
                    <h2 id="charName">Character Name</h2>
                    <div class="tags">
                        <span id="charStatus" class="tag status">Status</span>
                    </div>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">Bounty:</span>
                            <span class="value" id="charBounty">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Haki Types:</span>
                            <span class="value" id="charHaki">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Affiliation:</span>
                            <span class="value" id="charAffiliation">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Origin:</span>
                            <span class="value" id="charOrigin">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Race:</span>
                            <span class="value" id="charRace">-</span>
                        </div>
                        <div class="info-item">
                            <span class="label">First Appearance:</span>
                            <span class="value" id="charAppearance">-</span>
                        </div>
                    </div>
                    <div class="description-box">
                        <span class="label">Description:</span>
                        <p id="charDesc" class="description">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="fsViewer" class="fs-viewer">
        <span id="hint">🔒 Mode Terkunci - Layar Tetap Hidup</span>
        <img id="fsImg" src="" alt="Fullscreen Image">
        <div class="controls">
            <button class="btn btn-lock" id="lockBtn">🔒 LOCK</button>
            <button class="btn btn-unlock" id="unlockBtn">🔓 UNLOCK</button>
            <button class="btn btn-unlock" id="fsCloseBtn" style="position:absolute;top:20px;right:20px;padding:8px 12px">✕</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="wave">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V46.29c47.79,22.2,103.59,32.15,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" class="shape-fill"></path>
            </svg>
        </div>
        <div class="footer-content">
            <p>made for fun by me</p>
            <a href="https://wa.me/6282258941501" target="_blank" class="contact-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                </svg>
                Contact me
            </a>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="search.js"></script>
    <script src="theme.js"></script>
    <script src="modal.js"></script>
    <script src="fullscreen.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
